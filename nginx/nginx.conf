worker_processes 1;

events {
    worker_connections 1024;
}

http {

    include mime.types;


    server {
        listen 80;
        server_name localhost#public-Ip-Ec2;

        location / {
            proxy_pass http://my-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
   }
}
    